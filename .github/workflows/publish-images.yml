# Publish xpmile container images and release marvel on Heroku.
#
# Triggered on every push to main + on demand via the Actions UI.
#
# Four jobs:
#
# Job 1 — xpmile-cpp-builder:bootstrap — the shared toolchain layer
# (ACE/TAO 7.0.0 + mongo-c-driver + mongo-cxx-driver + googletest, on
# ubuntu:focal). Slow (~30 min per arch when not cached). Pushed first
# so Jobs 2-4 can `FROM` it via the BUILDER_IMAGE ARG.
#
# Job 2 — test — builds docker/Dockerfile.test against the just-
# published bootstrap and runs the offtarget GTest binary. Quality
# gate: if any test fails OR a compile error surfaces, jobs 3 + 4
# don't run.
#
# Job 3 — xpmile-wsdbagent — needs test + bootstrap. The on-prem
# NAT-side DB agent. Multi-arch (amd64/arm64) so customers on either
# architecture can pull `:latest`. Compile + assembly only (~5 min/arch
# after bootstrap is cached).
#
# Job 4 — xpmile-uniservice + Heroku release — needs test + bootstrap.
# The main web app, built linux/amd64 only (Heroku Common Runtime is
# amd64). One buildx invocation pushes the same image to FOUR targets:
# Docker Hub (mirror) + registry.heroku.com/marvel/web + registry.
# heroku.com/idp/web. Then `heroku container:release web` runs for
# both apps. The IdP dyno's role is decided at deploy time by the
# IDP_ISSUER config var on the `idp` app — when set, /api/v1/idp/*
# and /.well-known/openid-configuration activate; when unset (as on
# marvel) those routes return 503. See CLAUDE.md → In-house identity
# provider, and the design's "Resolved during implementation" Q1.
#
# Tags published:
#   docker.io/naushada/xpmile-cpp-builder:bootstrap        (rolling)
#   docker.io/naushada/xpmile-cpp-builder:<sha>            (immutable)
#   docker.io/naushada/xpmile-wsdbagent:latest             (rolling)
#   docker.io/naushada/xpmile-wsdbagent:<sha>              (immutable)
#   docker.io/naushada/xpmile-uniservice:latest            (rolling)
#   docker.io/naushada/xpmile-uniservice:<sha>             (immutable)
#   registry.heroku.com/marvel/web                         (released)
#   registry.heroku.com/idp/web                            (released)
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME = naushada
#   DOCKERHUB_TOKEN    = a Docker Hub access token with write scope
#                        (NOT your account password; create one at
#                        https://hub.docker.com/settings/security)
#   HEROKU_API_KEY     = output of `heroku auth:token` (long-lived API
#                        key, used to both push to registry.heroku.com
#                        and call the Platform API release endpoint)

name: Publish container images & release marvel + idp

on:
  push:
    # `main` keeps publishing rolling `:latest` + `:<sha>`.
    # `release/vX.Y` branches publish `:vX.Y` (rolling within the release line).
    # `vX.Y.Z` tags publish `:vX.Y.Z` (immutable, the recommended pin).
    # See CHANGELOG.md → "Image-tag scheme" for the operator-facing detail.
    branches: [main, 'release/**']
    tags:     ['v*']
    paths:
      # Skip the workflow when nothing publishable changed — saves
      # ~1 GB of registry pulls per docs-only PR.
      - 'docker/Dockerfile'
      - 'docker/Dockerfile.bootstrap'
      - 'docker/Dockerfile.test'
      - 'docker/Dockerfile.wsdbagent'
      - 'docker/Dockerfile.mongo'
      - 'docker/mongo-init.js'
      - 'CMakeLists.txt'
      - 'modules/**'
      - 'test/**'
      - 'ui/**'
      - 'ui-idp/**'
      - 'certs/**'
      # Operator-facing scripts + compose files: changes here can break the
      # on-prem stack or deploy path even when the C++ binaries are unchanged.
      # Gate them behind the test job so a script regression can't merge
      # silently.
      - 'run.sh'
      - 'run-agent.sh'
      - 'run-idp.sh'
      - 'deploy-heroku.sh'
      - 'install-agent.sh'
      - 'install-agent-runc.sh'
      - 'scripts/**'
      - 'tests/**'
      # Top-level docs that operators + contributors read first —
      # gate edits behind GTest so a contradictory claim about the
      # build/deploy contract doesn't merge silently.
      - 'README.md'
      - 'CLAUDE.md'
      - 'codebase.md'
      - 'docs/**'
      - 'docker-compose.yml'
      - 'docker-compose.agent.yml'
      - 'docker-compose.heroku.yml'
      - '.env.agent'
      - '.github/workflows/publish-images.yml'
  # PR runs are the merge gate: bootstrap + test only (no publish, no
  # Heroku release — see `if:` guards on wsdbagent + uniservice jobs).
  # Branch protection on `main` requires the test job's check to pass
  # before merge — see CLAUDE.md → Continuous integration.
  pull_request:
    branches: [main]
    paths:
      - 'docker/Dockerfile'
      - 'docker/Dockerfile.bootstrap'
      - 'docker/Dockerfile.test'
      - 'docker/Dockerfile.wsdbagent'
      - 'docker/Dockerfile.mongo'
      - 'docker/mongo-init.js'
      - 'CMakeLists.txt'
      - 'modules/**'
      - 'test/**'
      - 'ui/**'
      - 'ui-idp/**'
      - 'certs/**'
      # Operator-facing scripts + compose files: changes here can break the
      # on-prem stack or deploy path even when the C++ binaries are unchanged.
      # Gate them behind the test job so a script regression can't merge
      # silently.
      - 'run.sh'
      - 'run-agent.sh'
      - 'run-idp.sh'
      - 'deploy-heroku.sh'
      - 'install-agent.sh'
      - 'install-agent-runc.sh'
      - 'scripts/**'
      - 'tests/**'
      # Top-level docs that operators + contributors read first —
      # gate edits behind GTest so a contradictory claim about the
      # build/deploy contract doesn't merge silently.
      - 'README.md'
      - 'CLAUDE.md'
      - 'codebase.md'
      - 'docs/**'
      - 'docker-compose.yml'
      - 'docker-compose.agent.yml'
      - 'docker-compose.heroku.yml'
      - '.env.agent'
      - '.github/workflows/publish-images.yml'
  workflow_dispatch:

# Latest-push-wins: a newer push to main auto-cancels any earlier
# in-flight run of THIS workflow for THIS ref. Saves CI minutes and
# avoids the "v40 published from PR #93 while v41 is being built from
# PR #95" race. `cancel-in-progress: true` does the work; the `group:`
# key scopes "what counts as the same queue".
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY:         docker.io
  ORG:              naushada
  BOOTSTRAP_IMAGE:  docker.io/naushada/xpmile-cpp-builder
  WSDBAGENT_IMAGE:  docker.io/naushada/xpmile-wsdbagent
  UNISERVICE_IMAGE: docker.io/naushada/xpmile-uniservice
  # Per-arch mongo images so install-agent.sh can `podman pull` instead
  # of building locally — removes Dockerfile.mongo + mongo-init.js from
  # the operator's filesystem surface entirely. Two tags published:
  #   docker.io/naushada/xpmile-mongo:7         (default, amd64 + Pi 4/5 arm64)
  #   docker.io/naushada/xpmile-mongo:4.4.18    (Cortex-A53 / Pi 3B — pre-armv8.2-A)
  # `:latest` floats to `:7`.
  MONGO_IMAGE:      docker.io/naushada/xpmile-mongo
  HEROKU_APP:       marvel
  # Second Heroku app — the in-house OIDC identity provider. Per
  # docs/design/inhouse-idp/inhouse-idp-design.md §12 (Q1 resolved
  # during implementation), the same image deploys to both apps; what
  # turns marvel into the IdP is the IDP_ISSUER Heroku config var on
  # this app (when set, /api/v1/idp/* + /.well-known activate; when
  # unset they 503). Avoids drift between two CI pipelines and keeps
  # the InnerTLS CA single across the on-prem stack.
  HEROKU_APP_IDP:   idp

jobs:

  bootstrap:
    name: Publish xpmile-cpp-builder:bootstrap (multi-arch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build + push xpmile-cpp-builder:bootstrap
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.bootstrap
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.BOOTSTRAP_IMAGE }}:bootstrap
            ${{ env.BOOTSTRAP_IMAGE }}:${{ github.sha }}
          # Buildx registry-side cache so re-runs reuse layers.
          # `mode=max` exports every intermediate layer; without it we
          # only cache the final stage and lose most of the speedup.
          cache-from: type=registry,ref=${{ env.BOOTSTRAP_IMAGE }}:buildcache
          cache-to:   type=registry,ref=${{ env.BOOTSTRAP_IMAGE }}:buildcache,mode=max

  test:
    # Build the offtarget GTest image against the just-published
    # bootstrap, then RUN it. Quality gate for every downstream job —
    # failed tests OR a compile error stop the publish + Heroku
    # release. Three Mongo-dependent tests are excluded by the
    # Dockerfile.test CMD filter; wire up a Mongo sidecar here to
    # include them.
    #
    # Single-arch (amd64) — ubuntu-latest is amd64-only and offtarget
    # is logic-only (no arch-sensitive code). The same suite runs in
    # podman locally on whichever arch the developer has.
    name: Run offtarget GTest suite
    needs: bootstrap
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub (to pull bootstrap)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build offtarget test image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.test
          platforms: linux/amd64
          push: false
          load: true               # import into the local docker daemon
          build-args: |
            BUILDER_IMAGE=${{ env.BOOTSTRAP_IMAGE }}:bootstrap
          tags: xpmile-test:ci
          # No registry cache — the test image is one-shot, no consumers.

      - name: Run offtarget tests (3 Mongo-dependent tests excluded by Dockerfile CMD)
        run: docker run --rm xpmile-test:ci

  wsdbagent:
    name: Publish xpmile-wsdbagent (multi-arch)
    # Now serialized after uniservice — wsdbagent's Dockerfile bakes in
    # the matching client cert family from THIS workflow run's uniservice
    # image (Stage 0 of Dockerfile.wsdbagent, COPY --from=uniservice-source).
    # Operator-side refresh-certs then extracts from wsdbagent (~10 MB)
    # instead of uniservice (~500 MB). Adds ~10 min wall-clock vs the
    # old parallel layout, but correctness requires same-build CA + client
    # cert pairing.
    needs: [bootstrap, test, uniservice]
    # Skip on PR runs — PRs validate (bootstrap + test) but do not
    # publish to Docker Hub. Publish only on push to main / manual
    # dispatch.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Compute the version-aware image tag from the git ref:
      #   refs/tags/v1.1.0          → version_tag=v1.1.0  (immutable point release)
      #   refs/heads/release/v1.1   → version_tag=v1.1    (rolling within minor release line)
      #   anything else (main, PR)  → version_tag=""      (no extra tag)
      # Used in the `tags:` block below to add `:vX.Y(.Z)` alongside :latest + :<sha>.
      - name: Compute version tag from git ref
        id: version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            echo "tag=${GITHUB_REF_NAME#release/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build + push xpmile-wsdbagent
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.wsdbagent
          platforms: linux/amd64,linux/arm64
          push: true
          # UNISERVICE_REF pins to THIS workflow's per-sha uniservice tag
          # so wsdbagent bakes in the matching CA + client cert family.
          # `:latest` would be wrong — it can lag a CI release that took
          # a different path through uniservice (e.g. Heroku release failed
          # but Docker Hub publish succeeded).
          build-args: |
            BUILDER_IMAGE=${{ env.BOOTSTRAP_IMAGE }}:bootstrap
            UNISERVICE_REF=${{ env.UNISERVICE_IMAGE }}:${{ github.sha }}
          # The third tag is only included when version_tag is non-empty
          # (release branch push OR vX.Y.Z tag push). GHA strips empty
          # lines from the multi-line tags string, so the conditional
          # `&& ... || ''` produces a clean no-op on main pushes.
          tags: |
            ${{ env.WSDBAGENT_IMAGE }}:latest
            ${{ env.WSDBAGENT_IMAGE }}:${{ github.sha }}
            ${{ steps.version.outputs.tag != '' && format('{0}:{1}', env.WSDBAGENT_IMAGE, steps.version.outputs.tag) || '' }}
          cache-from: type=registry,ref=${{ env.WSDBAGENT_IMAGE }}:buildcache
          cache-to:   type=registry,ref=${{ env.WSDBAGENT_IMAGE }}:buildcache,mode=max

  # Job — publish xpmile-mongo so install-agent.sh can `podman pull`
  # instead of building locally on the operator's machine. Two flavour
  # tags published per push (operator picks via MONGO_TAG env var):
  #   ${MONGO_IMAGE}:7         — default for amd64 + Pi 4/5 arm64
  #   ${MONGO_IMAGE}:4.4.18    — Cortex-A53 / Pi 3B (last pre-armv8.2-A
  #                              build; bare 4.4 floats to 4.4.19+ which
  #                              SIGILL-crashes on Cortex-A53)
  #   ${MONGO_IMAGE}:latest    — alias for :7
  # The image is `mongo:{7,4.4.18}` + mongo-init.js baked at
  # /docker-entrypoint-initdb.d/ — see docker/Dockerfile.mongo.
  # No dependency on bootstrap or test (no C++ involved); runs in
  # parallel with wsdbagent for ~50 % faster publish wall-clock.
  mongo:
    name: Publish xpmile-mongo (multi-arch, both major versions)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - mongo_version: "7"
            extra_tag: latest
          - mongo_version: "4.4.18"
            extra_tag: ""
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Same version-tag-from-ref logic as the wsdbagent job. Output is
      # composed with the mongo_version matrix value so each variant
      # gets its own per-release tag (e.g. mongo:4.4.18-v1.1.0).
      - name: Compute version tag from git ref
        id: version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            echo "tag=${GITHUB_REF_NAME#release/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build + push xpmile-mongo:${{ matrix.mongo_version }}
        uses: docker/build-push-action@v5
        with:
          context: docker
          file: docker/Dockerfile.mongo
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            MONGO_VERSION=${{ matrix.mongo_version }}
          # ::: tag list :::
          #   :<version>                       e.g. :7, :4.4.18           — operator-pinnable version
          #   :<version>-<sha>                 immutable per-commit tag for rollback
          #   :latest                          only set for the default (7) row via extra_tag
          #   :<version>-<release_tag>         e.g. :7-v1.1.0             — only on release branch / tag push
          tags: |
            ${{ env.MONGO_IMAGE }}:${{ matrix.mongo_version }}
            ${{ env.MONGO_IMAGE }}:${{ matrix.mongo_version }}-${{ github.sha }}
            ${{ matrix.extra_tag != '' && format('{0}:{1}', env.MONGO_IMAGE, matrix.extra_tag) || '' }}
            ${{ steps.version.outputs.tag != '' && format('{0}:{1}-{2}', env.MONGO_IMAGE, matrix.mongo_version, steps.version.outputs.tag) || '' }}

  uniservice:
    name: Publish xpmile-uniservice + release marvel + idp on Heroku
    needs: [bootstrap, test]
    # Skip on PR runs — never push to Docker Hub or release on Heroku
    # from a PR branch. Only on push to main / manual dispatch.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to Heroku container registry
        uses: docker/login-action@v3
        with:
          registry: registry.heroku.com
          username: _
          password: ${{ secrets.HEROKU_API_KEY }}

      # Same version-tag-from-ref logic as the wsdbagent + mongo jobs.
      - name: Compute version tag from git ref
        id: version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            echo "tag=${GITHUB_REF_NAME#release/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      # Build amd64 only (Heroku is amd64). The same manifest is pushed
      # to both Docker Hub (mirror) and registry.heroku.com/marvel/web
      # in one shot — the Docker Hub copy is what `./run-agent.sh
      # refresh-certs` pulls on the on-prem MongoDB machine.
      #
      # provenance: false + outputs: oci-mediatypes=false — Heroku's
      # registry rejects OCI manifest lists and the buildx attestation
      # manifest. Together these tell buildx to emit a plain Docker
      # v2s2 manifest (matches what `podman push --format=v2s2` does
      # in deploy-heroku.sh), which both Heroku and Docker Hub accept.
      # Without `oci-mediatypes=false`, the push currently succeeds
      # because Heroku's CLI re-resolves the digest at release time,
      # but a future Heroku tightening or buildx upgrade can resurface
      # the "manifest unknown" / 404 errors we hit on PR #8's first
      # uniservice job. Mirrors onprem-pbx publish-cloud.
      - name: Build + push uniservice (amd64) to Docker Hub + Heroku
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          outputs: type=image,oci-mediatypes=false
          build-args: |
            BUILDER_IMAGE=${{ env.BOOTSTRAP_IMAGE }}:bootstrap
            UI_BUST=${{ github.sha }}
          # tags list:
          #   :latest                          rolling on main
          #   :<sha>                           immutable per commit
          #   :<release_tag>                   only on release branch / tag push (e.g. :v1.1.0)
          #   registry.heroku.com/.../web      release-track artifact for `heroku container:release`
          tags: |
            ${{ env.UNISERVICE_IMAGE }}:latest
            ${{ env.UNISERVICE_IMAGE }}:${{ github.sha }}
            ${{ steps.version.outputs.tag != '' && format('{0}:{1}', env.UNISERVICE_IMAGE, steps.version.outputs.tag) || '' }}
            registry.heroku.com/${{ env.HEROKU_APP }}/web
            registry.heroku.com/${{ env.HEROKU_APP_IDP }}/web
          cache-from: type=registry,ref=${{ env.UNISERVICE_IMAGE }}:buildcache
          cache-to:   type=registry,ref=${{ env.UNISERVICE_IMAGE }}:buildcache,mode=max

      # Release on Heroku via the official CLI. The earlier approach
      # (PATCH /formation with the buildx-reported digest) hit
      # `record not_found` because Heroku's registry stores its own
      # digest after the push, distinct from the OCI manifest digest
      # buildx emits. The CLI re-resolves the digest from the registry,
      # so it always uses the right one. Matches onprem-pbx's pattern.
      - name: Install Heroku CLI (one-shot, ~10 s)
        run: curl -fsSL https://cli-assets.heroku.com/install.sh | sudo sh

      - name: Release marvel on Heroku (heroku container:release web)
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: heroku container:release web --app "${HEROKU_APP}"

      # Release the SAME image (just pushed in the build step above) on
      # the idp Heroku app. Both apps now run identical bits; what makes
      # the idp dyno serve IdP traffic is the IDP_ISSUER config var
      # (set via `heroku config:set IDP_ISSUER=https://idp-<hash>.herokuapp.com --app idp`).
      # When unset on the marvel dyno every /api/v1/idp/* + /.well-known
      # route returns 503 — the dyno role is a deploy-time decision with
      # zero state to plumb. See CLAUDE.md → In-house identity provider.
      - name: Release idp on Heroku (heroku container:release web)
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: heroku container:release web --app "${HEROKU_APP_IDP}"

  # ── Job 5 ── xpmile-pull binary + runc-bundle tarball ──────────────────
  #
  # Phase H of the runc-pull TDD plan. Builds the standalone xpmile-pull
  # binary inside the bootstrap image (one matrix entry per architecture,
  # so amd64 + arm64 share the same source path), runs a real-Hub smoke
  # against alpine:3.19 on the amd64 leg only (saves QEMU minutes on the
  # arm64 leg — the binary doesn't need per-arch runtime validation;
  # cross-arch tests already verified the library in `offtarget`), and
  # assembles xpmile-runc-bundle-<tag>-<arch>.tar.gz. On a tag push the
  # tarballs upload to the GitHub release.
  runc-bundle:
    name: Build xpmile-pull + assemble runc-bundle tarball
    needs: [bootstrap, test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # for softprops/action-gh-release on a tag push
    strategy:
      matrix:
        arch: [amd64, arm64]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 build)
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3

      - name: Resolve version tag (release tag or short sha)
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [[ -f VERSION ]] && head -n1 VERSION | grep -E '^v[0-9]+\.' >/dev/null; then
            echo "version=$(head -n1 VERSION)" >> "$GITHUB_OUTPUT"
          else
            echo "version=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build xpmile-pull inside the bootstrap image
        run: |
          # The same Dockerfile.test image already builds xpmile-pull as
          # part of its `make -j2 offtarget xpmile-pull` step. Re-use it
          # here — saves a separate cross-build Dockerfile.
          docker buildx build \
              --platform "linux/${{ matrix.arch }}" \
              --build-arg BUILDER_IMAGE=docker.io/naushada/xpmile-cpp-builder:bootstrap \
              -f docker/Dockerfile.test \
              -t xpmile-build:${{ matrix.arch }} \
              --load \
              .

      - name: Extract xpmile-pull + bundle its non-glibc .so deps
        run: |
          # The bootstrap base is Debian Bullseye (libssl 1.1). Operator
          # targets are Bookworm / Pi OS Bookworm / Ubuntu 22.04+, which
          # ship libssl3. To stay portable across that boundary without
          # rebuilding the whole toolchain, we bundle every non-glibc
          # .so the binary needs alongside it in lib/, and ship a tiny
          # wrapper at bin/xpmile-pull that sets LD_LIBRARY_PATH.
          #
          # Excluded from the bundle: the dynamic linker, libc, libpthread,
          # libdl, libm, libnsl, libresolv, libutil, librt — those MUST
          # come from the operator host's glibc.
          mkdir -p artifacts/lib
          docker run --rm --platform "linux/${{ matrix.arch }}" \
              -v "$PWD/artifacts:/out" \
              xpmile-build:${{ matrix.arch }} \
              bash -c '
                set -euo pipefail
                cp /src/build/xpmile-pull /out/xpmile-pull
                ldd /src/build/xpmile-pull \
                    | awk "/=> \//{ print \$1, \$3 }" \
                    | while read soname path; do
                        case "$soname" in
                          linux-vdso.so*|ld-*|libc.so*|libpthread.so*|libdl.so*|libm.so*|libnsl.so*|libresolv.so*|libutil.so*|librt.so*) continue ;;
                        esac
                        cp -L "$path" "/out/lib/$soname"
                      done
                echo "── Bundled libs ──"
                ls -la /out/lib
              '
          file artifacts/xpmile-pull

      - name: Assemble xpmile-runc-bundle tarball
        id: tarball
        run: |
          VER="${{ steps.version.outputs.version }}"
          STAGE="xpmile-runc-bundle-${VER}-${{ matrix.arch }}"
          mkdir -p "stage/$STAGE/bin" "stage/$STAGE/lib" "stage/$STAGE/templates/systemd"
          echo "$VER" > "stage/$STAGE/VERSION"
          # The actual binary lives at bin/xpmile-pull.real. bin/xpmile-pull
          # is a tiny shell wrapper that prepends the bundled lib/ to
          # LD_LIBRARY_PATH so the binary finds libssl1.1 + libACE on hosts
          # that ship libssl3 (Bookworm, Pi OS, Ubuntu 22.04+).
          install -m 0755 artifacts/xpmile-pull "stage/$STAGE/bin/xpmile-pull.real"
          # NOTE: using printf (not heredoc) so the shebang lands at byte 0.
          # YAML's `run: |` preserves indentation, which would otherwise
          # push leading whitespace in front of `#!` and break the script.
          printf '%s\n' \
            '#!/bin/sh' \
            'HERE=$(dirname "$(readlink -f "$0")")' \
            'exec env LD_LIBRARY_PATH="$HERE/../lib:${LD_LIBRARY_PATH:-}" "$HERE/xpmile-pull.real" "$@"' \
            > "stage/$STAGE/bin/xpmile-pull"
          chmod 0755 "stage/$STAGE/bin/xpmile-pull"
          cp -a artifacts/lib/. "stage/$STAGE/lib/"
          install -m 0755 modules/module/runcpull/templates/install.sh "stage/$STAGE/install.sh"
          install -m 0755 install-agent-runc.sh "stage/$STAGE/install-agent-runc.sh"
          install -m 0644 modules/module/runcpull/templates/README.md "stage/$STAGE/templates/README.md"
          install -m 0644 modules/module/runcpull/templates/config.mongo.json "stage/$STAGE/templates/config.mongo.json"
          install -m 0644 modules/module/runcpull/templates/config.wsdbagent.json "stage/$STAGE/templates/config.wsdbagent.json"
          install -m 0644 modules/module/runcpull/templates/config.wsdbagent-idp.json "stage/$STAGE/templates/config.wsdbagent-idp.json"
          install -m 0644 modules/module/runcpull/templates/mongo-init.js "stage/$STAGE/templates/mongo-init.js"
          install -m 0644 modules/module/runcpull/templates/systemd/xpmile-mongo.service "stage/$STAGE/templates/systemd/"
          install -m 0644 modules/module/runcpull/templates/systemd/xpmile-wsdbagent.service "stage/$STAGE/templates/systemd/"
          install -m 0644 modules/module/runcpull/templates/systemd/xpmile-wsdbagent-idp.service "stage/$STAGE/templates/systemd/"
          install -m 0644 modules/module/runcpull/templates/systemd/xpmile-certs.path "stage/$STAGE/templates/systemd/"
          install -m 0644 modules/module/runcpull/templates/systemd/xpmile-certs-rotate.service "stage/$STAGE/templates/systemd/"
          ( cd stage && tar czf "../${STAGE}.tar.gz" "$STAGE" )
          echo "name=${STAGE}.tar.gz" >> "$GITHUB_OUTPUT"
          ls -la "${STAGE}.tar.gz"

      - name: Smoke test against assembled tarball (amd64 — real alpine:3.19)
        if: matrix.arch == 'amd64'
        run: |
          # Extract the tarball inside a clean ubuntu:22.04 (libssl3 only —
          # no libssl1.1) and run the bundled wrapper. This verifies the
          # bundled .so deps actually let the binary run on a host with a
          # different libssl major version.
          docker run --rm --network=host \
              -v "$PWD/${{ steps.tarball.outputs.name }}:/bundle.tar.gz:ro" \
              -v "$PWD/tests/smoke:/smoke:ro" \
              ubuntu:22.04 \
              bash -c 'apt-get update >/dev/null && \
                       apt-get install -y --no-install-recommends ca-certificates >/dev/null && \
                       mkdir -p /opt/bundle && \
                       tar -xzf /bundle.tar.gz -C /opt/bundle --strip-components=1 && \
                       PULL_BIN=/opt/bundle/bin/xpmile-pull /smoke/xpmile-pull-smoke.sh'

      - name: Assert tarball layout — required files all present
        run: |
          # Required-files check (≠ exact match): the lib/ dir contains
          # .so files whose SONAMEs may shift between bootstrap rebuilds
          # (e.g., libcrypto.so.1.1 vs libcrypto.so.3 if the base changes).
          # We assert every line in tests/expected-tarball-layout.txt is
          # present, and that at least one bundled .so exists in lib/.
          tar -tzf "${{ steps.tarball.outputs.name }}" \
              | sed -E "s|^xpmile-runc-bundle-[^/]+/||" \
              | grep -v '/$' \
              | grep -v '^$' \
              | sort > /tmp/got.txt
          sort tests/expected-tarball-layout.txt > /tmp/expected.txt
          missing=$(comm -23 /tmp/expected.txt /tmp/got.txt || true)
          if [[ -n "$missing" ]]; then
            echo "Tarball is missing required files:"
            echo "$missing"
            echo "── Tarball contents ──"
            cat /tmp/got.txt
            exit 1
          fi
          if ! grep -q '^lib/.*\.so' /tmp/got.txt; then
            echo "Tarball has no bundled .so files in lib/ — binary will not be portable"
            cat /tmp/got.txt
            exit 1
          fi
          echo "✓ all required files present + lib/ has bundled .so deps"

      - name: Upload as workflow artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.tarball.outputs.name }}
          path: ${{ steps.tarball.outputs.name }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload to GitHub Release (on tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.tarball.outputs.name }}
          fail_on_unmatched_files: true
