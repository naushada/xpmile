# docker-compose.agent.yml
#
# Production: runs on the MongoDB machine (behind NAT).
# Only outbound connections are needed — no inbound ports need to be opened.
#
# Local dev: run on the same machine as uniservice (see below).
#
# Usage (production — Heroku):
#   cp .env.agent .env        # set SERVER_HOST=marvel.herokuapp.com
#   podman-compose -f docker-compose.agent.yml up --build -d
#
# Usage (local dev — against local uniservice):
#   SERVER_HOST=host.containers.internal \
#     podman-compose -f docker-compose.agent.yml up --build
#   (uniservice must be running with REMOTE_DB=1 via docker-compose.yml)
#
# Environment variables (set in .env or export before running):
#
#   SERVER_HOST        Hostname to connect to (Heroku: marvel.herokuapp.com)
#   SERVER_PORT        Port to connect to (default: 443, TLS mandatory)
#   MONGO_ROOT_USER    MongoDB root username          (default: root)
#   MONGO_ROOT_PASS    MongoDB root password          (default: changeme)
#   MONGO_APP_USER     MongoDB app username           (default: xpmile)
#   MONGO_APP_PASS     MongoDB app password           (default: xpmile_pass)
#   MONGO_DB           Database name                  (default: xpmile)
#   MONGO_POOL         MongoDB connection pool size   (default: 10)
#   BACKOFF            Reconnect wait in seconds      (default: 5)
#   CERTS_DIR          Path to certs/ on host
#                      (default: ./certs/cloud-issued/innertls — written
#                       by `run-agent.sh refresh-certs`)
#
# Cert rotation:
#   xpmile-cert-watcher (alpine sidecar) md5sums CERTS_DIR every 5s
#   and POSTs `/libpod/containers/agent-wsdbagent/restart` via the
#   host podman socket on any change. End-to-end rotation latency
#   from `refresh-certs` → wsdbagent reconnected: ~15s.
#
#   Override the watcher poll interval with CERT_WATCH_POLL_SECONDS
#   (default 5).  Override the podman socket path with PODMAN_SOCKET
#   (default /run/podman/podman.sock — rootful).  For rootless use
#   `${XDG_RUNTIME_DIR}/podman/podman.sock`.

services:

  # ------------------------------------------------------------------
  # MongoDB — persistent store; data survives container restarts
  # ------------------------------------------------------------------
  mongodb:
    pull_policy: never
    build:
      context: ./docker
      dockerfile: Dockerfile.mongo
      args:
        # Override per-deploy: `MONGO_VERSION=4.4` in .env for Pi-3B-class
        # hosts (Cortex-A53 / armv8.0-A — mongo:5+ requires armv8.2-A).
        # Defaults to 7 on amd64 + Pi 4/5 / other arm64 hosts.
        MONGO_VERSION: ${MONGO_VERSION:-7}
    image: xpmile-mongo:latest
    container_name: agent-mongo
    user: "999:999"
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS:-changeme}
      MONGO_APP_USER: ${MONGO_APP_USER:-xpmile}
      MONGO_APP_PASS: ${MONGO_APP_PASS:-xpmile_pass}
    command: ["mongod", "--setParameter", "logComponentVerbosity={accessControl:{verbosity:0}}"]
    volumes:
      - mongo-data:/data/db
    networks:
      - agent-net
    healthcheck:
      # mongosh ships in mongo:5+; mongo:4.4 only has the legacy `mongo` shell
      # (Pi-3B operators pin to MONGO_VERSION=4.4.18 — see docker/Dockerfile.mongo).
      # Try mongosh first, fall back to mongo so the same compose file works
      # on both image lines. The PATH check is silent (>/dev/null), so the
      # actual ping output is the only thing podman parses for health state.
      test: ["CMD-SHELL", "( command -v mongosh >/dev/null && SHELL_CMD=mongosh || SHELL_CMD=mongo ) && $$SHELL_CMD -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --eval \"db.adminCommand('ping')\" --quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ------------------------------------------------------------------
  # wsdbagent — connects outbound to uniservice /ws/db
  #
  # Pulled from Docker Hub (published per-deploy by CI). The image
  # carries only the binary + runtime libs — the matching client
  # cert pair is mounted at /certs from the host (refreshed by
  # `./run-agent.sh refresh-certs`). To pin to a specific build,
  # set WSDBAGENT_IMAGE=docker.io/naushada/xpmile-wsdbagent:<sha>.
  #
  # Override with WSDBAGENT_LOCAL_BUILD=1 + a sibling compose file
  # that adds a `build:` directive if you're hacking on the agent
  # locally.
  # ------------------------------------------------------------------
  wsdbagent:
    image: ${WSDBAGENT_IMAGE:-docker.io/naushada/xpmile-wsdbagent:latest}
    pull_policy: always
    container_name: agent-wsdbagent
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      ARGS: >-
        --server-host ${SERVER_HOST:?SERVER_HOST must be set}
        --server-port ${SERVER_PORT:-443}
        --mongo-db-uri mongodb://${MONGO_APP_USER:-xpmile}:${MONGO_APP_PASS:-xpmile_pass}@mongodb:27017/${MONGO_DB:-xpmile}?authSource=admin
        --mongo-db-name ${MONGO_DB:-xpmile}
        --mongo-db-connection-pool ${MONGO_POOL:-10}
        --backoff ${BACKOFF:-5}
        --tls-ca /certs/ca.crt
        --tls-cert /certs/client.crt
        --tls-key /certs/client.key
        ${TLS_HOSTNAME:+--tls-hostname ${TLS_HOSTNAME}}
    volumes:
      - ${CERTS_DIR:-./certs/cloud-issued/innertls}:/certs:ro
    networks:
      - agent-net

  # ------------------------------------------------------------------
  # wsdbagent-idp — the second wsdbagent, dedicated to the in-house
  # IdP Heroku app. Mirrors `wsdbagent` exactly except for the outbound
  # SERVER_HOST and the container name. Per the design's Q1 resolution
  # (same image to both Heroku apps), both agents share ONE InnerTLS
  # CA + client cert family — refresh-certs rotates the single set on
  # disk; the cert-watcher below restarts BOTH agents in lockstep.
  #
  # Started only when IDP_SERVER_HOST is set in .env (run-agent.sh
  # auto-detects). Skip this service entirely on a marvel-only stack —
  # nothing else here depends on it. Both agents share the SAME
  # MongoDB instance + connection pool; per-request routing to the
  # `xpmile` vs `idp` database is determined by the cloud-side caller
  # (the dbproto envelope carries the target db name per Phase A).
  # ------------------------------------------------------------------
  wsdbagent-idp:
    image: ${WSDBAGENT_IMAGE:-docker.io/naushada/xpmile-wsdbagent:latest}
    pull_policy: always
    container_name: agent-wsdbagent-idp
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      ARGS: >-
        --server-host ${IDP_SERVER_HOST:?IDP_SERVER_HOST must be set when using the IdP agent}
        --server-port ${IDP_SERVER_PORT:-443}
        --mongo-db-uri mongodb://${MONGO_APP_USER:-xpmile}:${MONGO_APP_PASS:-xpmile_pass}@mongodb:27017/${IDP_MONGO_DB:-idp}?authSource=admin
        --mongo-db-name ${IDP_MONGO_DB:-idp}
        --mongo-db-connection-pool ${MONGO_POOL:-10}
        --backoff ${BACKOFF:-5}
        --tls-ca /certs/ca.crt
        --tls-cert /certs/client.crt
        --tls-key /certs/client.key
        ${IDP_TLS_HOSTNAME:+--tls-hostname ${IDP_TLS_HOSTNAME}}
    volumes:
      - ${CERTS_DIR:-./certs/cloud-issued/innertls}:/certs:ro
    networks:
      - agent-net

  # ------------------------------------------------------------------
  # xpmile-cert-watcher — restarts BOTH wsdbagent containers whenever
  # the rotated client cert family on disk changes.
  #
  # docker/Dockerfile mints a fresh CA per build (PR #8), so the
  # cert pair has to rotate every Heroku deploy or wsdbagent's
  # handshake fails with `tls_process_client_certificate verify
  # failed`. `run-agent.sh refresh-certs` (or a cron job calling
  # it) pulls the new cert pair from Docker Hub into
  # ./certs/cloud-issued/innertls/; this sidecar md5sums the dir
  # every CERT_WATCH_POLL_SECONDS and restarts wsdbagent on change.
  #
  # Polling, not inotify — bind mounts across podman machine VMs
  # (Lima on macOS, WSL2 on Windows) don't reliably propagate
  # inotify events. Polling is cheap (a handful of small files).
  # ------------------------------------------------------------------
  xpmile-cert-watcher:
    image: docker.io/library/alpine:3.19
    container_name: xpmile-cert-watcher
    restart: unless-stopped
    # The watcher POSTs to the container-engine REST API bind-mounted at
    # /run/podman/podman.sock (path is podman-named for backward compat;
    # operators on Docker mount /var/run/docker.sock to that same path
    # via PODMAN_SOCKET — see env block below). macOS `podman machine`
    # uses a Fedora VM with SELinux enforcing — the default
    # `container_t` label denies access to the socket's `var_run_t`.
    # `label=disable` turns off container labeling so the sidecar can
    # read/write the socket. No-op on Linux hosts without SELinux
    # (Raspberry Pi OS, Debian, Ubuntu).
    security_opt:
      - label=disable
    command:
      - sh
      - -c
      - |
        set -eu
        apk add --no-cache curl >/dev/null
        log() { printf '[cert-watcher %s] %s\n' "$$(date -u +%H:%M:%S)" "$$1"; }

        # ── Detect the container engine ────────────────────────────────
        # The mounted socket may be podman's libpod or docker's API.
        # Probe a libpod-only endpoint first; fall back to docker's
        # /_ping. Sets RESTART_URL_FMT to the matching restart endpoint
        # template (printf-substituted with the container name).
        SOCK=/run/podman/podman.sock
        if curl -fsS -o /dev/null --unix-socket $$SOCK \
                'http://d/v4.0.0/libpod/_ping' 2>/dev/null; then
          ENGINE=podman
          RESTART_URL_FMT='http://d/v4.0.0/libpod/containers/%s/restart?timeout=5'
        elif curl -fsS -o /dev/null --unix-socket $$SOCK \
                  'http://d/_ping' 2>/dev/null; then
          ENGINE=docker
          # Docker REST: GET /_ping → "OK", restart at /v1.41/containers/.../restart
          # (?t= for seconds, not ?timeout=). v1.41 is supported by Docker 20.10+.
          RESTART_URL_FMT='http://d/v1.41/containers/%s/restart?t=5'
        else
          log "FATAL — no container engine REST API responds on $$SOCK"
          log "       (expected podman libpod or docker API). Check the"
          log "       host-side socket path in PODMAN_SOCKET — it must"
          log "       point at the actual engine socket on this host."
          exit 1
        fi
        log "detected engine: $$ENGINE  (restart URL pattern: $$RESTART_URL_FMT)"

        log "watching /watch every $${POLL_SECONDS:-5}s for cert changes"
        # Both agents share the same cert family (design Q1 — same image
        # to both Heroku apps → one InnerTLS CA on-prem). When the file
        # set on /watch changes, restart EVERY agent we can find. The
        # idp-side agent is optional (marvel-only deployments don't run
        # it) — a 404 on its restart endpoint is benign and silently
        # treated as "not present, nothing to restart".
        restart_agent() {
          ctr="$$1"
          url=$$(printf "$$RESTART_URL_FMT" "$$ctr")
          rc=$$(curl -fsS -o /dev/null -w '%%{http_code}' \
                     -X POST --unix-socket $$SOCK \
                     "$$url" || echo "000")
          case "$$rc" in
            2*) log "  $$ctr restarted (HTTP $$rc)" ;;
            404) log "  $$ctr not present (skipped — marvel-only stack)" ;;
            *)  log "  $$ctr restart FAILED (HTTP $$rc — will retry next change)" ;;
          esac
        }
        LAST=""
        while true; do
          NEW=$$(find /watch -type f \( -name '*.crt' -o -name '*.key' -o -name '*.pem' \) -exec md5sum {} + 2>/dev/null \
                 | sort | md5sum | cut -d' ' -f1)
          if [ -n "$$NEW" ] && [ "$$NEW" != "$$LAST" ]; then
            if [ -n "$$LAST" ]; then
              log "cert change detected ($$LAST -> $$NEW); restarting both agents"
              restart_agent agent-wsdbagent
              restart_agent agent-wsdbagent-idp
            else
              log "first observation: $$NEW (no restart, baseline)"
            fi
            LAST=$$NEW
          fi
          sleep $${POLL_SECONDS:-5}
        done
    environment:
      POLL_SECONDS: ${CERT_WATCH_POLL_SECONDS:-5}
    volumes:
      - ${CERTS_DIR:-./certs/cloud-issued/innertls}:/watch:ro
      - ${PODMAN_SOCKET:-/run/podman/podman.sock}:/run/podman/podman.sock
    depends_on:
      wsdbagent:
        condition: service_started
      # wsdbagent-idp's service_started condition is intentionally NOT
      # set as a depends_on — that would force the cert-watcher to
      # block on a service that may not be in the active `up -d` set
      # (marvel-only deployments don't start wsdbagent-idp). The
      # restart loop above handles a missing container gracefully via
      # the 404 path.

  # ------------------------------------------------------------------
  # on-prem Vaadin admin UI — SSO provider configuration (opt-in).
  #
  # Writes the sso_config document directly to the co-located MongoDB
  # (sso-design.md §10) — the Heroku-side uniservice hot-reloads it
  # via wsdbagent every ~60 s. Reachable at
  # http://<host>:${ONPREM_PORT:-8090}/sso-config.
  #
  # Unauthenticated by design — sits behind the customer's physical /
  # network access controls. Hard requirement: do not expose port 8090
  # to the internet.
  #
  # Opt-in — `./run-agent.sh start` does NOT bring this up. Use
  # `./run-agent.sh onprem-ui start` instead. The service still lives
  # in this compose file so `down` / `logs` / `status` find it.
  # ------------------------------------------------------------------
  onprem-ui:
    pull_policy: never
    build:
      context: ./onprem
      dockerfile: Dockerfile
    image: xpmile-onprem:latest
    container_name: agent-onprem-ui
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      # Nested defaults (e.g. ${VAR:-https://${OTHER}}) trip up podman-compose's
      # parser — the outer expansion closes at the first `}` and the second is
      # appended as a literal, giving https://host}/api/v1/... 500s in the
      # Vaadin app. Require XPMILE_BACKEND_BASE_URL explicitly instead; the
      # .env.agent template already sets it.
      XPMILE_BACKEND_BASE_URL: "${XPMILE_BACKEND_BASE_URL:?XPMILE_BACKEND_BASE_URL must be set in .env}"
      XPMILE_MONGO_URI: "mongodb://${MONGO_APP_USER:-xpmile}:${MONGO_APP_PASS:-xpmile_pass}@mongodb:27017/${MONGO_DB:-xpmile}?authSource=admin"
      XPMILE_MONGO_DATABASE: "${MONGO_DB:-xpmile}"
    ports:
      - "${ONPREM_PORT:-8090}:8090"
    networks:
      - agent-net

# ------------------------------------------------------------------
# Named volume — MongoDB data persists across restarts and upgrades
# ------------------------------------------------------------------
volumes:
  mongo-data:

# ------------------------------------------------------------------
# Isolated bridge network — wsdbagent reaches MongoDB by service name
# ------------------------------------------------------------------
networks:
  agent-net:
    driver: bridge
