services:

  # ------------------------------------------------------------------
  # MongoDB — same image as the main stack
  # ------------------------------------------------------------------
  mongodb:
    pull_policy: never
    build:
      context: ./docker
      dockerfile: Dockerfile.mongo
    image: xpmile-mongo:latest
    container_name: xpmile-mongo
    user: "999:999"
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS:-changeme}
      MONGO_APP_USER: ${MONGO_APP_USER:-xpmile}
      MONGO_APP_PASS: ${MONGO_APP_PASS:-xpmile_pass}
    command: ["mongod", "--setParameter", "logComponentVerbosity={accessControl:{verbosity:0}}"]
    volumes:
      - mongo-data:/data/db
    networks:
      - xpmile-net
    healthcheck:
      test: ["CMD-SHELL", "mongosh -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --eval \"db.adminCommand('ping')\" --quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ------------------------------------------------------------------
  # wsdbagent — connects to Heroku + accepts local WS on port 8085
  # ------------------------------------------------------------------
  wsdbagent:
    pull_policy: never
    build:
      context: .
      dockerfile: docker/Dockerfile.wsdbagent
    image: wsdbagent:latest
    container_name: xpmile-wsdbagent
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      ARGS: >-
        --server-host ${SERVER_HOST:?SERVER_HOST must be set}
        --server-port ${SERVER_PORT:-443}
        --mongo-db-uri mongodb://${MONGO_APP_USER:-xpmile}:${MONGO_APP_PASS:-xpmile_pass}@mongodb:27017/${MONGO_DB:-xpmile}?authSource=admin
        --mongo-db-name ${MONGO_DB:-xpmile}
        --mongo-db-connection-pool ${MONGO_POOL:-10}
        --backoff ${BACKOFF:-5}
        --local-ws-port 8085
      NO_SSL: "${NO_SSL:-}"
    networks:
      - xpmile-net

  # ------------------------------------------------------------------
  # uniservice — connects to wsdbagent via WebSocket (connector mode)
  # ------------------------------------------------------------------
  app:
    pull_policy: never
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        UI_BUST: ${UI_BUST:-0}
    image: xpmile:latest
    container_name: xpmile-app
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      wsdbagent:
        condition: service_started
    environment:
      PORT: "${PORT:-8080}"
      ARGS: >-
        --server-worker ${SERVER_WORKERS:-5}
      REMOTE_DB: "${REMOTE_DB:-ws://wsdbagent:8085/ws/db}"
    ports:
      - "${HOST_PORT:-8080}:${PORT:-8080}"
    networks:
      - xpmile-net

  # ------------------------------------------------------------------
  # On-prem Java/Vaadin UI
  # Backend URL is configurable — local stack or remote (Heroku etc.)
  # ------------------------------------------------------------------
  onprem-ui:
    pull_policy: never
    build:
      context: ./onprem
      dockerfile: Dockerfile
    image: xpmile-onprem:latest
    container_name: xpmile-onprem-ui
    restart: unless-stopped
    environment:
      XPMILE_BACKEND_BASE_URL: "${XPMILE_BACKEND_BASE_URL:-http://app:8080}"
    ports:
      - "${ONPREM_PORT:-8090}:8090"
    networks:
      - xpmile-net

volumes:
  mongo-data:

networks:
  xpmile-net:
    driver: bridge
