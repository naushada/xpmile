<form [formGroup]="accountForm" clrForm clrLayout="compact" clrLabelSize="3">

  <!-- Lookup / action bar -->
  <div class="action-bar">
    <div formGroupName="loginCredentials" class="lookup-group">
      <clr-input-container>
        <label>Account Code</label>
        <input clrInput name="accountCode" formControlName="accountCode" />
      </clr-input-container>
    </div>
    <button type="button" class="btn btn-sm btn-outline" (click)="retrieveAccountInfo()">Retrieve</button>
    <button type="button" class="btn btn-primary" (click)="updateAccount()">Update Account</button>
  </div>

  <!-- Three-column body -->
  <div class="clr-row form-body">

    <!-- Login Credentials -->
    <div class="clr-col-4">
      <div class="card section-card">
        <div class="card-header">
          <cds-icon shape="key"></cds-icon> Login Credentials
        </div>
        <div class="card-block">
          <div formGroupName="loginCredentials">
            <clr-input-container>
              <label>Password</label>
              <input clrInput type="password" name="accountPassword" formControlName="accountPassword" />
            </clr-input-container>
          </div>
          <clr-input-container>
            <label>AWB Prefix</label>
            <input clrInput name="awbPrefix" formControlName="awbPrefix" />
          </clr-input-container>
        </div>
      </div>
    </div>

    <!-- Personal Info -->
    <div class="clr-col-4">
      <div class="card section-card">
        <div class="card-header">
          <cds-icon shape="user"></cds-icon> Personal Info
        </div>
        <div class="card-block">
          <div formGroupName="personalInfo">
            <clr-select-container>
              <label>Role</label>
              <select clrSelect name="role" formControlName="role">
                <option *ngFor="let rl of defVal?.Role" [value]="rl">{{rl}}</option>
              </select>
            </clr-select-container>
            <clr-input-container>
              <label>Name</label>
              <input clrInput name="name" formControlName="name" />
            </clr-input-container>
            <clr-select-container>
              <label>Event Location</label>
              <select clrSelect name="eventLocation" formControlName="eventLocation">
                <option *ngFor="let evtLoc of defVal?.EventLocation" [value]="evtLoc">{{evtLoc}}</option>
              </select>
            </clr-select-container>
            <clr-input-container>
              <label>City</label>
              <input clrInput name="city" formControlName="city" />
            </clr-input-container>
            <clr-input-container>
              <label>State</label>
              <input clrInput name="state" formControlName="state" />
            </clr-input-container>
            <clr-input-container>
              <label>Address</label>
              <input clrInput name="address" formControlName="address" />
            </clr-input-container>
            <clr-input-container>
              <label>Postal Code</label>
              <input clrInput name="postalCode" formControlName="postalCode" />
            </clr-input-container>
            <clr-input-container>
              <label>Contact</label>
              <input clrInput name="contact" formControlName="contact" />
            </clr-input-container>
            <clr-input-container>
              <label>E-Mail</label>
              <input clrInput name="email" formControlName="email" />
            </clr-input-container>
          </div>
        </div>
      </div>
    </div>

    <!-- Customer Info -->
    <div class="clr-col-4">
      <div class="card section-card">
        <div class="card-header">
          <cds-icon shape="building"></cds-icon> Customer Info
        </div>
        <div class="card-block">
          <div formGroupName="customerInfo">
            <clr-input-container>
              <label>Company Name</label>
              <input clrInput name="companyName" formControlName="companyName" />
            </clr-input-container>
            <clr-input-container>
              <label>Quoted Amount</label>
              <input clrInput name="quotedAmount" formControlName="quotedAmount" />
            </clr-input-container>
            <clr-input-container>
              <label>Trading License</label>
              <input clrInput name="tradingLicense" formControlName="tradingLicense" />
            </clr-input-container>
            <clr-input-container>
              <label>VAT</label>
              <input clrInput name="vat" formControlName="vat" />
            </clr-input-container>
            <clr-select-container>
              <label>Currency</label>
              <select clrSelect name="currency" formControlName="currency">
                <option *ngFor="let currency of defVal?.Currency" [value]="currency">{{currency}}</option>
              </select>
            </clr-select-container>
            <clr-input-container>
              <label>Bank Account No.</label>
              <input clrInput name="bankAccountNumber" formControlName="bankAccountNumber" />
            </clr-input-container>
            <clr-input-container>
              <label>IBAN</label>
              <input clrInput name="iban" formControlName="iban" />
            </clr-input-container>
          </div>
        </div>
      </div>
    </div>

  </div>

</form>
