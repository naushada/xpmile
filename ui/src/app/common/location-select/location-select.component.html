<div class="clr-row location-select">
  <div class="clr-col-12 clr-col-md-4">
    <clr-select-container>
      <label>Country</label>
      <select clrSelect [formControl]="countryControl">
        <option value=""></option>
        <option *ngIf="legacyCountry" [value]="legacyCountry">{{ legacyCountry }} (unknown)</option>
        <option *ngFor="let c of countries" [value]="c.name">{{ c.name }}</option>
      </select>
    </clr-select-container>
  </div>

  <div class="clr-col-12 clr-col-md-4">
    <clr-select-container>
      <label>State</label>
      <select clrSelect [formControl]="stateControl">
        <option value=""></option>
        <option *ngIf="legacyState" [value]="legacyState">{{ legacyState }} (unknown)</option>
        <option *ngFor="let s of states" [value]="s.name">{{ s.name }}</option>
      </select>
    </clr-select-container>
  </div>

  <div class="clr-col-12 clr-col-md-4">
    <!--
      Click-open dropdown for cities when the country-state-city package has
      data for the selected state; free-text input fallback when it doesn't
      (the package's city coverage is uneven by region — empty list would
      otherwise trap the operator).
    -->
    <clr-select-container *ngIf="cities.length > 0 || legacyCity">
      <label>City</label>
      <select clrSelect [formControl]="cityControl">
        <option value=""></option>
        <option *ngIf="legacyCity" [value]="legacyCity">{{ legacyCity }} (unknown)</option>
        <option *ngFor="let c of cities" [value]="c.name">{{ c.name }}</option>
      </select>
    </clr-select-container>
    <clr-input-container *ngIf="cities.length === 0 && !legacyCity">
      <label>City</label>
      <input clrInput [formControl]="cityControl"
             [placeholder]="stateControl.value ? 'Type city name' : 'Pick a state first'" />
    </clr-input-container>
  </div>
</div>
