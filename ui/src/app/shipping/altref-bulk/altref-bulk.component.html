<div class="bulk-page">

  <!-- Upload card -->
  <div class="upload-card">
    <div class="upload-icon">
      <cds-icon shape="upload-cloud" size="lg"></cds-icon>
    </div>
    <p class="upload-title">Bulk Update ALT REF Excel File</p>
    <p class="upload-sub">Accepted formats: .xls, .xlsx</p>

    <label for="altRefFileInput" class="btn btn-outline btn-sm browse-btn">
      Browse&hellip;
    </label>
    <input id="altRefFileInput" type="file"
           name="excelFileName"
           [formControl]="$any(bulkAltRefUpdateForm.controls['excelFileName'])"
           (change)="onFileSelect($event)"
           accept=".xls,.excel,.xlsx" />

    <p class="file-name" [class.has-file]="selectedFileName">
      {{ selectedFileName || 'No file selected' }}
    </p>
  </div>

  <!-- Action row -->
  <div class="action-row">
    <div class="template-block">
      <span class="template-label">ALT REF Update Template</span>
      <button type="button" class="btn btn-sm btn-outline"
              (click)="onDownloadTemplate()">Download</button>
    </div>

    <button type="button" class="btn btn-primary"
            [disabled]="isButtonEnabled"
            (click)="onUpdateBulkShipment()">
      Update Bulk ALT REF
    </button>
  </div>

</div>
