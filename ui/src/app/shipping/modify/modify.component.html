<form clrForm clrLayout="vertical" clrLabelSize="5" [formGroup]="modifyShipmentForm" class="ms-page">

  <!-- Page header -->
  <header class="ms-header">
    <div class="ms-header-left">
      <div class="ms-icon-tile" aria-hidden="true">
        <clr-icon shape="pencil" size="22"></clr-icon>
      </div>
      <div>
        <h2 class="ms-title">Update Single Shipment</h2>
        <p class="ms-subtitle">Look up a shipment by AWB or Alt. Ref. number, edit the details, then save.</p>
      </div>
    </div>
    <div class="ms-header-right">
      <span class="ms-step active"><span class="ms-step-no">1</span> Lookup</span>
      <span class="ms-step active"><span class="ms-step-no">2</span> Edit</span>
      <span class="ms-step active"><span class="ms-step-no">3</span> Save</span>
    </div>
  </header>

  <!-- Lookup card -->
  <section class="ms-card ms-lookup-card">
    <div class="ms-card-head">
      <clr-icon shape="search" size="18"></clr-icon>
      <h3>Lookup Shipment</h3>
      <span class="ms-card-hint">Find by AWB or Alt. Ref.</span>
    </div>
    <div class="ms-card-body">
      <div class="ms-lookup-grid">
        <div class="ms-lookup-pair">
          <clr-input-container>
            <label>AWB No.</label>
            <input clrInput name="awbno" formControlName="awbno" placeholder="Air Waybill number" />
          </clr-input-container>
          <button class="btn btn-sm btn-outline ms-retrieve-btn" type="button" (click)="onFetchByAwbNo()">
            <clr-icon shape="refresh" size="12"></clr-icon> Retrieve
          </button>
        </div>
        <div class="ms-lookup-pair">
          <clr-input-container>
            <label>Alt. Ref. No.</label>
            <input clrInput name="altRefNo" formControlName="altRefNo" placeholder="Alternate reference" />
          </clr-input-container>
          <button class="btn btn-sm btn-outline ms-retrieve-btn" type="button" (click)="onFetchByAltRefNo()">
            <clr-icon shape="refresh" size="12"></clr-icon> Retrieve
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- Three section cards -->
  <div class="ms-cards-grid">

    <!-- Sender -->
    <section class="ms-card" formGroupName="senderInformation">
      <div class="ms-card-head">
        <clr-icon shape="user" size="18"></clr-icon>
        <h3>Sender Information</h3>
        <span class="ms-card-hint">Who is shipping</span>
      </div>
      <div class="ms-card-body">
        <clr-input-container>
          <label>Account No.</label>
          <input clrInput name="accountNo" formControlName="accountNo" />
        </clr-input-container>
        <clr-input-container>
          <label>Reference No.</label>
          <input clrInput name="referenceNo" formControlName="referenceNo" />
        </clr-input-container>
        <clr-input-container>
          <label>Name</label>
          <input clrInput name="name" formControlName="name" />
        </clr-input-container>
        <clr-input-container>
          <label>Company</label>
          <input clrInput name="companyName" formControlName="companyName" />
        </clr-input-container>
        <clr-input-container>
          <label>Country</label>
          <input clrInput name="country" formControlName="country" />
        </clr-input-container>
        <clr-input-container>
          <label>City</label>
          <input clrInput name="city" formControlName="city" />
        </clr-input-container>
        <clr-input-container>
          <label>State</label>
          <input clrInput name="state" formControlName="state" />
        </clr-input-container>
        <clr-input-container>
          <label>Address</label>
          <input clrInput name="address" formControlName="address" />
        </clr-input-container>
        <clr-input-container>
          <label>Postal Code</label>
          <input clrInput name="postalCode" formControlName="postalCode" />
        </clr-input-container>
        <clr-input-container>
          <label>Contact</label>
          <input clrInput name="contact" formControlName="contact" />
        </clr-input-container>
        <clr-input-container>
          <label>Phone</label>
          <input clrInput name="phoneNumber" formControlName="phoneNumber" />
        </clr-input-container>
        <clr-input-container>
          <label>E-Mail</label>
          <input clrInput name="email" formControlName="email" />
        </clr-input-container>
        <clr-input-container>
          <label>Tax ID</label>
          <input clrInput name="receivingTaxId" formControlName="receivingTaxId" />
        </clr-input-container>
      </div>
    </section>

    <!-- Shipment -->
    <section class="ms-card" formGroupName="shipmentInformation">
      <div class="ms-card-head">
        <clr-icon shape="bundle" size="18"></clr-icon>
        <h3>Shipment Information</h3>
        <span class="ms-card-hint">What is shipping</span>
      </div>
      <div class="ms-card-body">
        <clr-input-container>
          <label>SKU No.</label>
          <input clrInput name="skuNo" formControlName="skuNo" />
        </clr-input-container>
        <clr-input-container>
          <label>Service</label>
          <input clrInput name="service" formControlName="service" />
        </clr-input-container>
        <clr-input-container class="ms-required">
          <label>No. of Items <span class="ms-asterisk">*</span></label>
          <input clrInput name="numberOfItems" formControlName="numberOfItems" />
        </clr-input-container>
        <clr-input-container>
          <label>Goods Desc.</label>
          <input clrInput name="goodsDescription" formControlName="goodsDescription" />
        </clr-input-container>
        <clr-input-container>
          <label>Goods Value</label>
          <input clrInput name="goodsValue" formControlName="goodsValue" />
        </clr-input-container>
        <clr-input-container>
          <label>Customs Value</label>
          <input clrInput name="customsValue" formControlName="customsValue" />
        </clr-input-container>
        <clr-input-container>
          <label>COD Amount</label>
          <input clrInput name="codAmount" formControlName="codAmount" />
        </clr-input-container>
        <clr-input-container>
          <label>VAT</label>
          <input clrInput name="vat" formControlName="vat" />
        </clr-input-container>
        <clr-input-container>
          <label>Currency</label>
          <input clrInput name="currency" formControlName="currency" />
        </clr-input-container>
        <clr-input-container>
          <label>Weight</label>
          <input clrInput name="weight" formControlName="weight" />
        </clr-input-container>
        <clr-input-container>
          <label>Weight Unit</label>
          <input clrInput name="weightUnits" formControlName="weightUnits" />
        </clr-input-container>
        <clr-input-container>
          <label>Cubic (LxBxH)</label>
          <input clrInput name="cubicWeight" formControlName="cubicWeight" />
        </clr-input-container>
      </div>
    </section>

    <!-- Receiver -->
    <section class="ms-card" formGroupName="receiverInformation">
      <div class="ms-card-head">
        <clr-icon shape="users" size="18"></clr-icon>
        <h3>Receiver Information</h3>
        <span class="ms-card-hint">Where it's going</span>
      </div>
      <div class="ms-card-body">
        <clr-input-container>
          <label>Name</label>
          <input clrInput name="name" formControlName="name" />
        </clr-input-container>
        <clr-input-container>
          <label>Country</label>
          <input clrInput name="country" formControlName="country" />
        </clr-input-container>
        <clr-input-container>
          <label>City</label>
          <input clrInput name="city" formControlName="city" />
        </clr-input-container>
        <clr-input-container>
          <label>State</label>
          <input clrInput name="state" formControlName="state" />
        </clr-input-container>
        <clr-input-container>
          <label>Postal Code</label>
          <input clrInput name="postalCode" formControlName="postalCode" />
        </clr-input-container>
        <clr-input-container>
          <label>Contact</label>
          <input clrInput name="contact" formControlName="contact" />
        </clr-input-container>
        <clr-input-container>
          <label>Address</label>
          <input clrInput name="address" formControlName="address" />
        </clr-input-container>
        <clr-input-container>
          <label>Phone</label>
          <input clrInput name="phone" formControlName="phone" />
        </clr-input-container>
        <clr-input-container>
          <label>E-Mail</label>
          <input clrInput name="email" formControlName="email" />
        </clr-input-container>
      </div>
    </section>

  </div>

  <!-- Sticky action bar -->
  <div class="ms-action-bar">
    <span class="ms-action-hint"><span class="ms-asterisk">*</span> required</span>
    <button type="button" class="btn btn-primary ms-update-btn" (click)="onShipmentUpdate()">
      <clr-icon shape="check" size="14"></clr-icon> Update Shipment
    </button>
  </div>

</form>
