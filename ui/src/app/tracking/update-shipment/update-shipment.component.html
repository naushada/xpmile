<form clrForm clrLayout="vertical" clrLabelSize="5" [formGroup]="updateShipmentStatus" class="us-page">

  <!-- Page header -->
  <header class="us-header">
    <div class="us-header-left">
      <div class="us-icon-tile" aria-hidden="true">
        <clr-icon shape="pencil" size="22"></clr-icon>
      </div>
      <div>
        <h2 class="us-title">Update Shipment Status</h2>
        <p class="us-subtitle">Log a tracking event against one or more Air Waybill numbers.</p>
      </div>
    </div>
  </header>

  <div class="us-cards-grid">

    <!-- Shipment & Event card -->
    <section class="us-card">
      <div class="us-card-head">
        <clr-icon shape="bundle" size="18"></clr-icon>
        <h3>Shipment &amp; Event</h3>
        <span class="us-card-hint">What happened</span>
      </div>
      <div class="us-card-body">

        <clr-textarea-container>
          <label for="shipmentNo">Connote</label>
          <textarea clrTextarea name="shipmentNo" placeholder="One or more AWB numbers (one per line)"
                    formControlName="shipmentNo" rows="3"></textarea>
        </clr-textarea-container>

        <clr-select-container>
          <label>Event</label>
          <select clrSelect name="events" formControlName="events">
            <option *ngFor="let evt of this.defValue?.Events" [value]="evt">
              {{evt}}
            </option>
          </select>
        </clr-select-container>

        <div class="us-row-2">
          <clr-date-container>
            <label>Current Date</label>
            <input type="date" clrDate name="currentDate" formControlName="currentDate"/>
          </clr-date-container>

          <clr-input-container>
            <label>Current Time</label>
            <input type="time" clrInput name="currentTime" formControlName="currentTime"/>
          </clr-input-container>
        </div>
      </div>
    </section>

    <!-- Notes & Personnel card -->
    <section class="us-card">
      <div class="us-card-head">
        <clr-icon shape="map-marker" size="18"></clr-icon>
        <h3>Location &amp; Personnel</h3>
        <span class="us-card-hint">Where and who</span>
      </div>
      <div class="us-card-body">

        <clr-textarea-container>
          <label for="notes">Notes</label>
          <textarea clrTextarea name="notes" placeholder="Optional notes for this event"
                    formControlName="notes" rows="3"></textarea>
        </clr-textarea-container>

        <clr-select-container>
          <label>Event Location</label>
          <select clrSelect name="eventLocation" formControlName="eventLocation">
            <option *ngFor="let cuntry of this.defValue?.CountryName" [value]="cuntry">
              {{cuntry}}
            </option>
          </select>
        </clr-select-container>

        <clr-input-container>
          <label>Manual Event Location</label>
          <input type="text" clrInput name="manualEventLocation" formControlName="manualEventLocation"
                 placeholder="Overrides the dropdown when filled">
        </clr-input-container>

        <div class="us-row-2">
          <clr-input-container>
            <label>Driver Name</label>
            <input type="text" clrInput name="driverName" formControlName="driverName">
          </clr-input-container>

          <clr-input-container>
            <label>Updated By</label>
            <input type="text" clrInput name="updatedBy" formControlName="updatedBy">
          </clr-input-container>
        </div>
      </div>
    </section>
  </div>

  <!-- Sticky action bar -->
  <div class="us-action-bar">
    <span class="us-action-hint">Submitting updates each AWB number on its own line.</span>
    <button type="button" class="btn btn-primary us-submit-btn" (click)="onSubmit()">
      <clr-icon shape="upload-cloud" size="14"></clr-icon> Submit
    </button>
  </div>

</form>
